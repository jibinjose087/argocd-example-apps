apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jibinjose087/argocd-example-apps.git
    targetRevision: topic-05-sources
    path: kustomize-guestbook
    kustomize:
      images:
        - gcr.io/google-samples/gb-frontend=nginx:1.27-alpine
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
